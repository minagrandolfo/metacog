<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metacog Trainer</title>
  <script src="https://unpkg.com/jspsych@8"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-button-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8/css/jspsych.css">
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #lang-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      gap: 4px;
      background: white;
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #lang-toggle button {
      border: none;
      background: transparent;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      border-radius: 4px;
    }
    #lang-toggle button.active {
      background: #2a8;
      color: white;
    }

    #landing {
      max-width: 620px;
      margin: 30px auto;
      background: white;
      color: #222;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    @media (min-width: 700px) {
      #landing { margin: 50px auto; padding: 36px 40px; }
    }
    #landing h1 { margin-top: 0; font-weight: 600; }
    #landing p { line-height: 1.5; }

    .badge {
      background: #eef6ff;
      border: 1px solid #aac;
      color: #224;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .partial-section { margin-bottom: 18px; }
    .partial-section h3 { margin: 0 0 8px 0; font-size: 14px; color: #555; }
    .partial-card {
      background: #fff8dc;
      border: 1px solid #d4b840;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .partial-card .info { flex: 1 1 200px; color: #5a4a10; }
    .partial-card .actions { display: flex; gap: 6px; }
    .partial-card button {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #999;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .partial-card button.resume {
      background: #2a8;
      color: white;
      border-color: #197;
      font-weight: 500;
    }
    .partial-card button.resume:hover { background: #197; }

    .mode-buttons {
      display: flex;
      gap: 12px;
      margin: 18px 0 8px 0;
      flex-wrap: wrap;
    }
    .mode-buttons button {
      flex: 1 1 200px;
      min-height: 64px;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: 500;
      border: 2px solid #bbb;
      background: white;
      color: #333;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-buttons button:hover { border-color: #555; background: #f5f5f5; }
    .mode-buttons button:active { transform: scale(0.97); background: #e0e0e0; }
    .mode-buttons button.selected {
      border-color: #2a8;
      background: #eaf6ee;
      color: #176;
      box-shadow: 0 0 0 3px rgba(42, 136, 102, 0.25);
    }

    .recommend-note {
      background: #f6f8fa;
      border-left: 3px solid #888;
      padding: 10px 14px;
      margin: 14px 0 22px 0;
      font-size: 14px;
      color: #555;
    }

    .checklist {
      margin: 24px 0 16px 0;
      border-top: 1px solid #eee;
      padding-top: 16px;
    }
    .checklist h3 { margin: 0 0 10px 0; font-size: 16px; color: #444; }
    .checklist label { display: block; padding: 8px 0; cursor: pointer; font-size: 15px; }
    .checklist input { margin-right: 10px; transform: scale(1.3); vertical-align: middle; }

    .quality-note { font-size: 13px; color: #777; font-style: italic; margin-top: 10px; }

    #start-btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      background: #2a8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 22px;
    }
    #start-btn:hover:not(:disabled) { background: #197; }
    #start-btn:disabled { background: #c0c0c0; cursor: not-allowed; }

    .disclaimer { font-size: 12px; color: #999; text-align: center; margin-top: 20px; }

    .jspsych-display-element {
      background-color: #000;
      color: white;
    }
    .jspsych-content { max-width: 800px; }
    h2 { color: white; }

    .jspsych-btn {
      padding: 12px 20px;
      font-size: 16px;
      margin: 6px;
      min-height: 48px;
      min-width: 100px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div id="lang-toggle">
  <button data-lang="fr">FR</button>
  <button data-lang="en">EN</button>
</div>

<div id="landing"></div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/metacog.js"></script>
<script src="js/rdk.js"></script>
<script src="js/staircase.js"></script>
<script src="js/sheets.js"></script>
<script src="js/experiment.js"></script>
<script>
function renderLanding() {
  document.querySelectorAll('#lang-toggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === getLang());
  });

  const root = document.getElementById('landing');

  const last = lastSession();
  let historyBadge = '';
  if (last) {
    const modeLabel = last.mode === 'evaluate' ? t('modeEvalLabel') : t('modeTrainLabel');
    const accStr = last.accuracy != null ? ` — ${t('accuracyShort')} ${(last.accuracy*100).toFixed(0)}%` : '';
    const brierStr = last.brier != null ? ` — Brier ${last.brier.toFixed(3)}` : '';
    historyBadge = `<div class="badge"><b>${t('lastSession')}</b> ${modeLabel} ${formatTimeAgo(last.timestamp)}${accStr}${brierStr}</div>`;
  }

  const partials = listPartialSessions();
  let partialBlock = '';
  if (partials.length > 0) {
    partialBlock = `<div class="partial-section"><h3>${t('partialTitle')}</h3>`;
    partials.forEach(p => {
      const modeLabel = p.mode === 'evaluate' ? t('modeEvalLabel') : t('modeTrainLabel');
      const info = t('partialItem', {
        mode: modeLabel,
        count: p.trials.length,
        total: p.total_trials || '?',
        date: formatDateTime(p.last_update || p.started)
      });
      partialBlock += `
        <div class="partial-card">
          <div class="info">${info}</div>
          <div class="actions">
            <button class="resume" data-resume="${p.sessionId}">${t('btnResume')}</button>
            <button data-delete="${p.sessionId}">${t('btnDelete')}</button>
          </div>
        </div>
      `;
    });
    partialBlock += '</div>';
  }

  root.innerHTML = `
    <h1>${t('title')}</h1>
    <p>${t('intro')}</p>
    ${historyBadge}
    ${partialBlock}
    <h3 style="margin-bottom:8px">${t('chooseMode')}</h3>
    <div class="mode-buttons">
      <button data-mode="evaluate">${t('btnEvaluate')}<br><span style="font-size:13px;font-weight:400">${t('btnEvaluateDesc')}</span></button>
      <button data-mode="train">${t('btnTrain')}<br><span style="font-size:13px;font-weight:400">${t('btnTrainDesc')}</span></button>
    </div>
    <div class="recommend-note">${t('recommendNote')}</div>
    <div class="checklist">
      <h3>${t('checklistTitle')}</h3>
      <label><input type="checkbox" name="qc"> ${t('check1')}</label>
      <label><input type="checkbox" name="qc"> ${t('check2')}</label>
      <label><input type="checkbox" name="qc"> ${t('check3')}</label>
      <label><input type="checkbox" name="qc"> ${t('check4')}</label>
      <p class="quality-note">${t('qualityNote')}</p>
    </div>
    <button id="start-btn" disabled></button>
    <p class="disclaimer">${t('disclaimer')}</p>
  `;

  attachLandingListeners();
}

function attachLandingListeners() {
  const root = document.getElementById('landing');
  let selectedMode = null;
  const modeButtons = root.querySelectorAll('.mode-buttons button');
  const checkboxes = root.querySelectorAll('.checklist input[type="checkbox"]');
  const startBtn = root.querySelector('#start-btn');

  function updateStartButton() {
    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
    const ready = selectedMode && allChecked;
    startBtn.disabled = !ready;
    if (ready) startBtn.textContent = t('btnStartReady');
    else if (!selectedMode && !allChecked) startBtn.textContent = t('btnStartNothingDone');
    else if (!selectedMode) startBtn.textContent = t('btnStartNoMode');
    else startBtn.textContent = t('btnStartNoBoxes');
  }

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMode = btn.dataset.mode;
      updateStartButton();
    });
  });

  checkboxes.forEach(cb => cb.addEventListener('change', updateStartButton));

  startBtn.addEventListener('click', () => {
    if (startBtn.disabled) return;
    document.getElementById('landing').hidden = true;
    document.getElementById('lang-toggle').style.display = 'none';
    runExperiment(selectedMode);
  });

  root.querySelectorAll('button[data-resume]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.resume;
      const partial = loadPartialSession(sid);
      if (!partial) return;
      document.getElementById('landing').hidden = true;
      document.getElementById('lang-toggle').style.display = 'none';
      runExperiment(partial.mode, {
        sessionId: sid,
        trials: partial.trials,
        staircase_state: partial.staircase_state
      });
    });
  });

  root.querySelectorAll('button[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => {
      clearPartialSession(btn.dataset.delete);
      renderLanding();
    });
  });

  updateStartButton();
}

document.querySelectorAll('#lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

renderLanding();
</script>

</body>
</html>
