<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metacog Trainer</title>
  <script src="https://unpkg.com/jspsych@8"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-button-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8/css/jspsych.css">
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #lang-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      gap: 4px;
      background: white;
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #lang-toggle button {
      border: none;
      background: transparent;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      border-radius: 4px;
    }
    #lang-toggle button.active {
      background: #2a8;
      color: white;
    }

    #landing {
      max-width: 620px;
      margin: 30px auto;
      background: white;
      color: #222;
      padding: 28px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    @media (min-width: 700px) {
      #landing { margin: 50px auto; padding: 36px 40px; }
    }
    #landing h1 { margin-top: 0; font-weight: 600; }
    #landing p { line-height: 1.5; }

    .badge {
      background: #eef6ff;
      border: 1px solid #aac;
      color: #224;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .partial-section { margin-bottom: 18px; }
    .partial-section h3 { margin: 0 0 8px 0; font-size: 14px; color: #555; }
    .partial-card {
      background: #fff8dc;
      border: 1px solid #d4b840;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .partial-card .info { flex: 1 1 200px; color: #5a4a10; }
    .partial-card .actions { display: flex; gap: 6px; }
    .partial-card button {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #999;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .partial-card button.resume {
      background: #2a8;
      color: white;
      border-color: #197;
      font-weight: 500;
    }
    .partial-card button.resume:hover { background: #197; }

    .mode-buttons {
      display: flex;
      gap: 12px;
      margin: 18px 0 8px 0;
      flex-wrap: wrap;
    }
    .mode-buttons button {
      flex: 1 1 200px;
      min-height: 64px;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: 500;
      border: 2px solid #bbb;
      background: white;
      color: #333;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-buttons button:hover { border-color: #555; background: #f5f5f5; }
    .mode-buttons button:active { transform: scale(0.97); background: #e0e0e0; }
    .mode-buttons button.selected {
      border-color: #2a8;
      background: #eaf6ee;
      color: #176;
      box-shadow: 0 0 0 3px rgba(42, 136, 102, 0.25);
    }

    .recommend-note {
      background: #f6f8fa;
      border-left: 3px solid #888;
      padding: 10px 14px;
      margin: 14px 0 22px 0;
      font-size: 14px;
      color: #555;
    }

    .checklist {
      margin: 24px 0 16px 0;
      border-top: 1px solid #eee;
      padding-top: 16px;
    }
    .checklist h3 { margin: 0 0 10px 0; font-size: 16px; color: #444; }
    .checklist label { display: block; padding: 8px 0; cursor: pointer; font-size: 15px; }
    .checklist input { margin-right: 10px; transform: scale(1.3); vertical-align: middle; }

    .quality-note { font-size: 13px; color: #777; font-style: italic; margin-top: 10px; }

    #start-btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      background: #2a8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 22px;
    }
    #start-btn:hover:not(:disabled) { background: #197; }
    #start-btn:disabled { background: #c0c0c0; cursor: not-allowed; }

    .disclaimer { font-size: 12px; color: #999; text-align: center; margin-top: 20px; }

    .about-footer {
      font-size: 11.5px;
      color: #888;
      text-align: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      line-height: 1.55;
    }
    .about-footer a { color: #2a8; text-decoration: none; }
    .about-footer a:hover { text-decoration: underline; }

    .jspsych-display-element {
      background-color: #000;
      color: white;
    }
    .jspsych-content { max-width: 800px; }
    h2 { color: white; }

    .jspsych-btn {
      padding: 12px 20px;
      font-size: 16px;
      margin: 6px;
      min-height: 48px;
      min-width: 100px;
      border-radius: 8px;
    }

    #jspsych-html-button-response-btngroup,
    #jspsych-canvas-button-response-btngroup {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 4px;
      max-width: 100%;
      width: 100%;
    }

    @media (max-width: 600px) {
      .jspsych-btn {
        padding: 10px 4px;
        font-size: 12px;
        min-width: 0;
        margin: 3px 0;
        flex: 1 1 0;
        max-width: 120px;
      }
      .jspsych-content { padding: 0 6px; max-width: 100%; }
    }

    .code-section {
      background: #f6f8fa;
      border: 1px solid #ddd;
      padding: 12px 14px;
      border-radius: 8px;
      margin: 14px 0;
    }
    .code-section h3 { margin: 0 0 8px 0; font-size: 14px; color: #555; }
    .code-display {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .code-value {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #176;
      background: white;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .code-section button {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #999;
      background: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .code-section button.history-btn {
      background: #2a8;
      color: white;
      border-color: #197;
      font-weight: 500;
    }
    .code-section input[type="text"] {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      width: 140px;
    }
    .code-explain { font-size: 12px; color: #666; margin: 8px 0 0 0; line-height: 1.5; }

    #history-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #history-modal-overlay.show { display: flex; }
    #history-modal {
      background: white;
      color: #222;
      max-width: 540px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #history-modal h2 { margin-top: 0; }
    .session-row {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .session-row:last-child { border-bottom: none; }
    .modal-close {
      margin-top: 14px;
      padding: 10px 18px;
      background: #2a8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .feedback-section {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .feedback-section h3 { margin: 0 0 8px 0; font-size: 14px; color: #555; font-weight: 600; }
    .feedback-toggle-btn {
      padding: 8px 14px;
      font-size: 13px;
      background: white;
      border: 1px solid #aaa;
      border-radius: 5px;
      cursor: pointer;
      color: #444;
    }
    .feedback-toggle-btn:hover { background: #f5f5f5; border-color: #555; }
    .feedback-form {
      margin-top: 12px;
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
    }
    .feedback-form textarea {
      width: 100%;
      min-height: 90px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #bbb;
      border-radius: 4px;
      box-sizing: border-box;
      resize: vertical;
    }
    .feedback-form input[type="email"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 4px;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .feedback-form .email-note {
      font-size: 12px;
      color: #777;
      margin: 4px 0 10px 0;
      line-height: 1.4;
    }
    .feedback-form .send-btn {
      padding: 9px 18px;
      font-size: 14px;
      background: #2a8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 500;
    }
    .feedback-form .send-btn:hover:not(:disabled) { background: #197; }
    .feedback-form .send-btn:disabled { background: #c0c0c0; cursor: not-allowed; }
    .feedback-status {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
    .feedback-status.ok { color: #197; font-weight: 500; }
    .feedback-status.err { color: #c33; }
    .feedback-status.info { color: #555; font-style: italic; }
</style>
</head>
<body>

<div id="lang-toggle">
  <button data-lang="fr">FR</button>
  <button data-lang="en">EN</button>
  <button data-lang="it">IT</button>
</div>

<div id="landing"></div>

<div id="history-modal-overlay">
  <div id="history-modal"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/metacog.js"></script>
<script src="js/rdk.js"></script>
<script src="js/staircase.js"></script>
<script src="js/sheets.js"></script>
<script src="js/experiment.js"></script>
<script>
function renderLanding() {
  document.querySelectorAll('#lang-toggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === getLang());
  });

  const root = document.getElementById('landing');

  const last = lastSession();
  let historyBadge = '';
  if (last) {
    const modeLabel = last.mode === 'evaluate' ? t('modeEvalLabel') : t('modeTrainLabel');
    const accStr = last.accuracy != null ? ` — ${t('accuracyShort')} ${(last.accuracy*100).toFixed(0)}%` : '';
    const brierStr = last.brier != null ? ` — Brier ${last.brier.toFixed(3)}` : '';
    historyBadge = `<div class="badge"><b>${t('lastSession')}</b> ${modeLabel} ${formatTimeAgo(last.timestamp)}${accStr}${brierStr}</div>`;
  }

  const partials = listPartialSessions();
  let partialBlock = '';
  if (partials.length > 0) {
    partialBlock = `<div class="partial-section"><h3>${t('partialTitle')}</h3>`;
    partials.forEach(p => {
      const modeLabel = p.mode === 'evaluate' ? t('modeEvalLabel') : t('modeTrainLabel');
      const info = t('partialItem', {
        mode: modeLabel,
        count: p.trials.length,
        total: p.total_trials || '?',
        date: formatDateTime(p.last_update || p.started)
      });
      partialBlock += `
        <div class="partial-card">
          <div class="info">${info}</div>
          <div class="actions">
            <button class="resume" data-resume="${p.sessionId}">${t('btnResume')}</button>
            <button data-delete="${p.sessionId}">${t('btnDelete')}</button>
          </div>
        </div>
      `;
    });
    partialBlock += '</div>';
  }

  const userCode = getUserCode();
  const codeBlock = `
    <div class="code-section">
      <h3>${t('yourCode')}</h3>
      <div class="code-display">
        <span class="code-value" id="user-code-display">${userCode}</span>
        <button id="copy-code-btn">${t('btnCopyCode')}</button>
        <button class="history-btn" id="history-btn">${t('viewHistory', {n: getSessionHistory().length})}</button>
      </div>
      <p class="code-explain">${t('yourCodeExplain')}</p>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:13px;color:#555">${t('haveCode')}</span>
        <input type="text" id="enter-code-input" placeholder="MX7-K3R" maxlength="7">
        <button id="load-code-btn">${t('btnLoadCode')}</button>
      </div>
    </div>
  `;

  root.innerHTML = `
    <h1>${t('title')}</h1>
    ${t('intro')}
    ${historyBadge}
    ${partialBlock}
    ${codeBlock}
    <h3 style="margin-bottom:8px">${t('chooseMode')}</h3>
    <div class="mode-buttons">
      <button data-mode="evaluate">${t('btnEvaluate')}<br><span style="font-size:13px;font-weight:400">${t('btnEvaluateDesc')}</span></button>
      <button data-mode="train">${t('btnTrain')}<br><span style="font-size:13px;font-weight:400">${t('btnTrainDesc')}</span></button>
    </div>
    <div class="recommend-note">${t('recommendNote')}</div>
    <div class="checklist">
      <h3>${t('checklistTitle')}</h3>
      <label><input type="checkbox" name="qc"> ${t('check1')}</label>
      <label><input type="checkbox" name="qc"> ${t('check2')}</label>
      <label><input type="checkbox" name="qc"> ${t('check3')}</label>
      <label><input type="checkbox" name="qc"> ${t('check4')}</label>
      <p class="quality-note">${t('qualityNote')}</p>
    </div>
    <div style="background:#eaf6ee;border:1px solid #2a8;color:#176;padding:10px 14px;border-radius:6px;margin:8px 0 0 0;font-size:13px;line-height:1.5">${t('privacyNote')}</div>
    <button id="start-btn" disabled></button>
    <p class="disclaimer">${t('disclaimer')}</p>

    <div class="feedback-section">
      <h3>${t('feedbackTitle')}</h3>
      <button class="feedback-toggle-btn" id="feedback-toggle">${t('feedbackToggleOpen')}</button>
      <div class="feedback-form" id="feedback-form" hidden>
        <textarea id="feedback-message" placeholder="${t('feedbackPlaceholder')}"></textarea>
        <input type="email" id="feedback-email" placeholder="${t('feedbackEmailPlaceholder')}">
        <p class="email-note">${t('feedbackEmailNote')}</p>
        <button class="send-btn" id="feedback-send">${t('btnSendFeedback')}</button>
        <div class="feedback-status" id="feedback-status"></div>
      </div>
    </div>

    <p class="about-footer">${t('aboutFooter')}</p>
  `;

  attachLandingListeners();
}

function attachLandingListeners() {
  const root = document.getElementById('landing');
  let selectedMode = null;
  const modeButtons = root.querySelectorAll('.mode-buttons button');
  const checkboxes = root.querySelectorAll('.checklist input[type="checkbox"]');
  const startBtn = root.querySelector('#start-btn');

  function updateStartButton() {
    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
    const ready = selectedMode && allChecked;
    startBtn.disabled = !ready;
    if (ready) startBtn.textContent = t('btnStartReady');
    else if (!selectedMode && !allChecked) startBtn.textContent = t('btnStartNothingDone');
    else if (!selectedMode) startBtn.textContent = t('btnStartNoMode');
    else startBtn.textContent = t('btnStartNoBoxes');
  }

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMode = btn.dataset.mode;
      updateStartButton();
    });
  });

  checkboxes.forEach(cb => cb.addEventListener('change', updateStartButton));

  startBtn.addEventListener('click', () => {
    if (startBtn.disabled) return;
    document.getElementById('landing').hidden = true;
    document.getElementById('lang-toggle').style.display = 'none';
    runExperiment(selectedMode);
  });

  root.querySelectorAll('button[data-resume]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.resume;
      const partial = loadPartialSession(sid);
      if (!partial) return;
      document.getElementById('landing').hidden = true;
      document.getElementById('lang-toggle').style.display = 'none';
      runExperiment(partial.mode, {
        sessionId: sid,
        trials: partial.trials,
        staircase_state: partial.staircase_state
      });
    });
  });

  root.querySelectorAll('button[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => {
      clearPartialSession(btn.dataset.delete);
      renderLanding();
    });
  });

  const copyBtn = root.querySelector('#copy-code-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      const code = root.querySelector('#user-code-display').textContent;
      try {
        navigator.clipboard.writeText(code);
        copyBtn.textContent = t('codeCopied');
        setTimeout(() => copyBtn.textContent = t('btnCopyCode'), 1500);
      } catch (e) {}
    });
  }

  const loadBtn = root.querySelector('#load-code-btn');
  if (loadBtn) {
    loadBtn.addEventListener('click', () => {
      const input = root.querySelector('#enter-code-input');
      const code = input.value.trim().toUpperCase();
      if (!code) return;
      setUserCode(code);
      renderLanding();
      alert(t('codeLoaded'));
    });
  }

  const historyBtn = root.querySelector('#history-btn');
  if (historyBtn) {
    historyBtn.addEventListener('click', () => openHistoryModal());
  }

  const fbToggle = root.querySelector('#feedback-toggle');
  const fbForm = root.querySelector('#feedback-form');
  if (fbToggle && fbForm) {
    fbToggle.addEventListener('click', () => {
      const isOpen = !fbForm.hidden;
      fbForm.hidden = isOpen;
      fbToggle.textContent = isOpen ? t('feedbackToggleOpen') : t('feedbackToggleClose');
    });
  }

  const fbSend = root.querySelector('#feedback-send');
  if (fbSend) {
    fbSend.addEventListener('click', async () => {
      const msgEl = root.querySelector('#feedback-message');
      const emailEl = root.querySelector('#feedback-email');
      const statusEl = root.querySelector('#feedback-status');
      const message = (msgEl.value || '').trim();
      const email = (emailEl.value || '').trim();
      if (!message) {
        statusEl.className = 'feedback-status err';
        statusEl.textContent = t('feedbackEmpty');
        return;
      }
      fbSend.disabled = true;
      statusEl.className = 'feedback-status info';
      statusEl.textContent = t('feedbackSending');
      const result = await sendFeedback(message, email, getUserCode());
      if (result && result.status === 'ok') {
        statusEl.className = 'feedback-status ok';
        statusEl.textContent = t('feedbackSent');
        msgEl.value = '';
        emailEl.value = '';
      } else {
        statusEl.className = 'feedback-status err';
        statusEl.textContent = t('feedbackError');
      }
      fbSend.disabled = false;
    });
  }

  updateStartButton();
}

async function openHistoryModal() {
  const overlay = document.getElementById('history-modal-overlay');
  const modal = document.getElementById('history-modal');
  modal.innerHTML = `<h2>${t('historyTitle')}</h2><p>${t('historyFetching')}</p>`;
  overlay.classList.add('show');

  const userCode = getUserCode();
  const localSessions = getSessionHistory();
  let serverSessions = await fetchUserHistory(userCode);

  let allSessions;
  if (serverSessions === null) {
    allSessions = localSessions.map(s => ({
      timestamp: s.timestamp,
      mode: s.mode,
      n_trials: s.n_trials,
      accuracy: s.accuracy,
      mRatio: s.mRatio,
      auroc2: s.auroc2,
      brier: s.brier
    }));
  } else {
    const localTimestamps = new Set(localSessions.map(s => +new Date(s.timestamp)));
    const serverFiltered = serverSessions.filter(s => !localTimestamps.has(+new Date(s.timestamp)));
    allSessions = [...localSessions, ...serverFiltered].sort((a, b) => +new Date(a.timestamp) - +new Date(b.timestamp));
  }

  const enriched = allSessions.map((s, i) => ({ ...s, idx: i + 1 }));

  const hasMRatio = enriched.some(s => s.mRatio != null && isFinite(s.mRatio));
  const metric = hasMRatio ? 'mRatio' : 'accuracy';
  const metricLabel = hasMRatio ? t('historyMetricMRatio') : t('historyMetricAccuracy');
  const chart = enriched.length > 0 ? sessionEvolutionSVG(enriched, metric) : '';

  let listHTML = '';
  if (enriched.length === 0) {
    listHTML = `<p>${userCode === getUserCode() ? t('historyServerEmptyOwn') : t('historyServerEmpty')}</p>`;
  } else {
    listHTML = enriched.map(s => {
      const date = formatDateTime(+new Date(s.timestamp));
      const modeLabel = s.mode === 'evaluate' ? t('modeEvalLabel') : t('modeTrainLabel');
      const acc = s.accuracy != null ? `${(s.accuracy*100).toFixed(0)}%` : '-';
      const mr = s.mRatio != null && isFinite(s.mRatio) ? s.mRatio.toFixed(2) : '-';
      return `<div class="session-row"><b>#${s.idx}</b> ${date} · ${modeLabel} · acc ${acc} · m-ratio ${mr}</div>`;
    }).join('');
  }

  modal.innerHTML = `
    <h2>${t('historyTitle')}</h2>
    <p style="font-size:13px;color:#666">${t('historyExplain')}</p>
    <div style="margin:14px 0">
      <p style="font-size:13px;color:#444;margin:0 0 6px 0;text-align:center"><b>${metricLabel}</b></p>
      ${chart}
    </div>
    <div style="margin-top:14px">${listHTML}</div>
    ${serverSessions === null && SHEETS_ENDPOINT ? `<p style="font-size:12px;color:#a44;margin-top:10px">${t('historyServerError')}</p>` : ''}
    <button class="modal-close" id="modal-close-btn">${t('historyClose')}</button>
  `;
  document.getElementById('modal-close-btn').addEventListener('click', () => {
    overlay.classList.remove('show');
  });
}

document.querySelectorAll('#lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

renderLanding();
</script>
